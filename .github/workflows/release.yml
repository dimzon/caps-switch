name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - name: Build
        run: |
          go run github.com/akavel/rsrc@latest -ico assets/icon.ico -o rsrc.syso -arch amd64
          go build -trimpath -ldflags "-s -w -H windowsgui" -o caps-switch.exe .

      - name: Package
        run: |
          Compress-Archive -Path caps-switch.exe, README.md, LICENSE -DestinationPath "caps-switch-${{ github.ref_name }}-windows-amd64.zip"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" caps-switch.exe "caps-switch-${{ github.ref_name }}-windows-amd64.zip" --generate-notes --title "caps-switch ${{ github.ref_name }}"
